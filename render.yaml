# Blueprint do Render — https://render.com/docs/blueprint-spec
# Ao conectar o repositorio, o Render le este arquivo e cria o servico sozinho.
services:
  - type: web
    name: correlacao-rtc
    runtime: python
    plan: free
    region: oregon
    branch: master
    buildCommand: pip install -r requirements.txt
    # 1 worker: o estado (analises, consultas de NCM e cesta) vive na memoria do processo
    startCommand: gunicorn wsgi:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Cadastro de usuarios e contagem de consultas: vao para o banco abaixo, e nao
      # para o disco (que o Render apaga a cada deploy, reinicio ou hibernacao).
      - key: DATABASE_URL
        fromDatabase:
          name: correlacao-rtc-db
          property: connectionString
      # Sessoes: sem esta chave fixa, cada deploy desconecta quem estava logado.
      - key: RTC_SECRET_KEY
        generateValue: true
      # Senhas dos usuarios de fabrica - defina em Environment, no painel do Render:
      # RTC_SENHA_ADMIN, RTC_SENHA_CLIENTE, RTC_SENHA_TESTE.

databases:
  - name: correlacao-rtc-db
    databaseName: correlacao_rtc
    plan: free
    region: oregon
